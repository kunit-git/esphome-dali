#
# Sample firmware for my ESP32 PoE ethernet dev board
#
# NOTE: Only IDF v4 / Arduino 2.0 support the RTL PHY. See:
# https://github.com/esphome/feature-requests/issues/1462
#

substitutions:
  device_name: dali_master
  device_description: PoE DALI Master

# https://esphome.io/components/esphome.html
esphome:
  name: ${device_name}
  comment: ${device_description}
  name_add_mac_suffix: true

esp32:
  board: esp32dev
  framework:
    type: arduino

ethernet:
  type: RTL8201
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_OUT
  phy_addr: 0

external_components:
  - source: 
      type: local
      path: components

# Enable Home Assistant API
api:

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# Define one light per DALI device, using its short address. On boot each light reads its
# lamp's actual state (on/off + brightness) and reflects it in Home Assistant WITHOUT
# changing the lamp, so restarting the controller no longer resets your lights.
#
# Tip: set `discovery: true` on the `dali:` bus below for one boot and watch the logs - it
# lists the short address of every device found so you know what to put in `address:` here.
light:
  - platform: dali
    name: "DALI Light 0"
    address: 0
    # color_mode: BRIGHTNESS          # force a mode (ON_OFF, BRIGHTNESS, COLOR_TEMPERATURE, RGB, RGBW), or omit to auto-detect
    # gamma_correct: 1.0              # default; the DALI gear applies its own dimming curve
    # fade_time: 1s
    # cold_white_color_temperature: 4000K
    # warm_white_color_temperature: 2700K

  - platform: dali
    name: "DALI Light 1"
    address: 1

output:


dali:
  id: dali_bus
  tx_pin: 32
  rx_pin: 33
  discovery: false  # Informational only: logs the addresses of devices found on the bus (entities must still be declared above)
  initialize_addresses: false  # Devices are expected to already have short addresses; never auto-assign on boot
